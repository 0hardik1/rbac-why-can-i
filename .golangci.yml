# golangci-lint v2 configuration.
# The v2 defaults (errcheck, govet, ineffassign, staticcheck, unused) plus a
# few high-signal additions. Kept conservative so it stays useful rather than
# noisy; revive's exported-symbol doc enforcement is intentionally not enabled.
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - misspell # common spelling mistakes in comments/strings
    - unconvert # unnecessary type conversions
    - gocritic # opinionated but high-value diagnostics

formatters:
  enable:
    - gofmt
